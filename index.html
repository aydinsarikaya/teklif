<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CUR="TRY";const fmt=(n,c)=>(n||0).toLocaleString("tr-TR",{style:"currency",currency:c||CUR});const fq=(q,n)=>fmt(n,q.cur||"TRY");
const iso=d=>d.toLocaleDateString("sv-SE");
const today=()=>iso(new Date());
const addDays=(s,n)=>iso(new Date(new Date(s+"T12:00:00").getTime()+n*864e5));
const trDate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("tr-TR"):"";
const ST={draft:"Taslak",sent:"Gönderildi",won:"Kabul edildi",lost:"Reddedildi",expired:"Süresi doldu",side:"Yan Teklif"};
let quotes=[],db=null,filter="all";
const LS="teklif_v1";
function loadLocal(){try{quotes=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){quotes=[]}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(quotes))}catch(e){}}

function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },150);
}

async function persist(q){const i=quotes.findIndex(x=>x.id===q.id);if(i<0)quotes.push(q);else quotes[i]=q;
 if(db){try{await db.doc("quotes/"+q.id).set(q)}catch(e){toast("Kaydedilemedi")}}else saveLocal();render()}
async function removeQ(id){quotes=quotes.filter(x=>x.id!==id);
 if(db){try{await db.doc("quotes/"+id).delete()}catch(e){}}else saveLocal();render()}
const calc=q=>{const sub=q.items.reduce((a,i)=>a+(i.opt?0:(+i.qty||0)*(+i.price||0)),0);return{sub,vat:0,tot:sub}};
const lastSigner=()=>{const s=[...quotes].filter(x=>x.signer).sort((a,b)=>b.date.localeCompare(a.date))[0];return s?s.signer:"Aydın SARIKAYA, Elektrik Mühendisi"};
const eff=q=>q.status==="sent"&&addDays(q.date,+q.valid||0)<today()?"expired":q.status;
const isDue=q=>q.status==="sent"&&eff(q)==="sent"&&q.next&&q.next<=today();

function copy(t){const ok=()=>toast("Kopyalandı");
 const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("Kopyalanamadı")}a.remove()};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function quoteText(q){CUR=q.cur||"TRY";const t=calc(q);return "Sayın "+q.customer+",\n\n"+q.no+" numaralı teklifimiz aşağıdadır:\n\n"+
 q.items.filter(i=>i.desc).map(i=>"• "+i.desc+(i.brand?" ("+i.brand+")":"")+": "+i.qty+" x "+fmt(+i.price)+" = "+fmt(i.qty*i.price)).join("\n")+
 "\n\nKDV Hariç Genel Toplam: "+fmt(t.sub)+
 "\n\nTeklifimiz "+trDate(addDays(q.date,+q.valid))+" tarihine kadar geçerlidir."+(q.notes?"\n\nNot: "+q.notes:"")+"\n\nSaygılarımla"}
function inqText(q){const sg=(q.signer||lastSigner()).replace(", ","\n");return "Sayın "+(q.attn||q.customer)+",\n\n"+(q.project?q.project+(/proje/i.test(q.project)?"":" Projesi")+" kapsamında ":"")+trDate(q.date)+" tarihinde ilettiğimiz "+q.no+" numaralı teklifimizin durumunu öğrenmek isteriz. Teklifimiz "+trDate(addDays(q.date,+q.valid))+" tarihine kadar geçerlidir.\n\nDeğerlendirmeniz sırasında bir sorunuz ya da revize talebiniz varsa memnuniyetle yardımcı oluruz.\n\nSaygılarımızla,\n"+sg+"\n"+COMP.n}
const inqSubj=q=>q.no+" numaralı teklifimiz hakkında"+(q.project?" – "+q.project:"");
const mailHref=q=>"mailto:"+q.email+"?subject="+encodeURIComponent(inqSubj(q))+"&body="+encodeURIComponent(inqText(q));
const followText=q=>inqText(q)
function nextNo(){const n=quotes.map(q=>{const m=/^TK-(\d+)$/i.exec((q.no||"").trim());return m?+m[1]:0});return "TK-"+(Math.max(321,...n)+1)}

function render(){

function parsePdfToQuoteObject(txt) {
  txt = txt.replace(/Aydınla\s+tma/g, "Aydınlatma");
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

  const noMatch = txt.match(/\b(TK-\d+|[A-Z0-9]{2,6}-\d+)\b/i);
  const no = noMatch ? noMatch[1].toUpperCase() : "";

  let date = "";
  let validUntil = "";
  const dMatch = txt.slice(0, 1500).match(/\b(\d{1,2})[./-](\d{1,2})[./-](\d{4})\b/);
  if (dMatch) {
    date = `${dMatch[3]}-${dMatch[2].padStart(2, '0')}-${dMatch[1].padStart(2, '0')}`;
  } else {
    date = today();
  }

  const valMatch = txt.match(/Geçerlilik:\s*(\d{1,2})[./-](\d{1,2})[./-](\d{4})/i);
  if (valMatch) {
    validUntil = `${valMatch[3]}-${valMatch[2].padStart(2, '0')}-${valMatch[1].padStart(2, '0')}`;
  }

  let valid = 15;
  if (date && validUntil) {
    const diff = Math.round((new Date(validUntil + "T12:00:00") - new Date(date + "T12:00:00")) / 864e5);
    if (diff > 0 && diff < 400) valid = diff;
  }

  let cur = "EUR";
  if (/(?:\bTL\b|TRY|₺|Türk Lirası)/i.test(txt) && !/Teklif kuru Euro/i.test(txt)) {
    cur = "TRY";
  } else if (/(?:\bUSD\b|\$|Dolar)/i.test(txt) && !/Teklif kuru Euro/i.test(txt)) {
    cur = "USD";
  }

  let attn = "";
  const attnMatch = txt.match(/Sayın\s+(.*?)\s+Dikkatlerine/i);
  if (attnMatch) attn = attnMatch[1].trim();

  let customer = "";
  let contact = "";
  const ownRe = /ayd[ıi]n\s+sar[ıi]kaya|gazi\s+üniversitesi|teknokent|gölbaşı|koç\s+kuleleri|söğütözü|bahçelievler|info@aydn/i;

  let attnIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/dikkatlerine/i.test(lines[i])) { attnIdx = i; break; }
  }

  const candLines = (attnIdx > 0 ? lines.slice(0, attnIdx) : lines.slice(0, 10)).filter(l => {
    return !ownRe.test(l) &&
           !/^(AYD|N|Teklif Takip)$/i.test(l) &&
           !/^Not:/i.test(l) &&
           !/^TK-\d+/i.test(l) &&
           !/^\d{1,2}[./-]\d{1,2}[./-]\d{4}$/.test(l);
  });
  if (candLines.length > 0) customer = candLines[0].trim();
  if (candLines.length > 1) contact = candLines[1].trim();

  let termsHdrIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/^Ticari\s+Koşullar/i.test(lines[i])) {
      termsHdrIdx = i;
      break;
    }
  }

  let tableHdrIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/açıklamalar|marka\s*\/\s*model|birim\s+fiyat/i.test(lines[i])) {
      tableHdrIdx = i;
      break;
    }
  }

  // SADECE "Sayın ... Dikkatlerine" ile "Ticari Koşullar:" arasındaki kısa giriş cümlesini alır!
  let introLines = [];
  if (attnIdx >= 0) {
    const endIntro = termsHdrIdx > attnIdx ? termsHdrIdx : (tableHdrIdx > attnIdx ? tableHdrIdx : attnIdx + 3);
    introLines = lines.slice(attnIdx + 1, endIntro).filter(l => !l.startsWith("Not:"));
  }
  const rawIntro = introLines.join(" ").trim();

  let project = "";
  let konu = "";
  const pMatch = rawIntro.match(/([^\n,]+?)\s+Projesi\b/i);
  if (pMatch) project = pMatch[1].trim();

  const kMatch = rawIntro.match(/hazırlamış\s+olduğumuz\s+(.*?)\s+teklifimiz/i) || rawIntro.match(/(Helvar[^\n]+?Sistemi)/i);
  if (kMatch) konu = kMatch[1].trim();

  // Standart cümle şablonu kullanıldığında intro="" bırakılır, böylece showDoc tek bir temiz paragraf üretir (mükerrerlik olmaz!)
  let intro = "";
  if (rawIntro && !/kapsamında\s+hazırlamış\s+olduğumuz/i.test(rawIntro)) {
    intro = rawIntro;
  }

  let terms = "";
  const termsMatch = txt.match(/Ticari Koşullar:\s*\n([\s\S]*?)(?=\n\s*(?:Teklifimizin uygun|Saygılarımızla|Not:|Aydın Sarıkaya|$))/i);
  if (termsMatch) {
    const rawTerms = termsMatch[1].trim().split(/\r?\n/);
    const formatted = [];
    for (let tl of rawTerms) {
      let s = tl.trim();
      if (!s) continue;
      if (/^[a-z]\.\s/i.test(s)) {
        formatted.push("   " + s);
      } else if (/^\d+\.\s/.test(s)) {
        formatted.push(s);
      } else {
        if (formatted.length > 0) formatted[formatted.length - 1] += " " + s;
        else formatted.push(s);
      }
    }
    terms = formatted.join("\n");
  }

  if (valMatch && terms) {
    terms = terms.replace(valMatch[0], "Geçerlilik: {GECERLILIK}");
  }

  let teslim = "4-6 hafta";
  const tesMatch = (terms || txt).match(/Malzeme Teslimi:\s*([^.\n]+)/i);
  if (tesMatch) {
    const subTes = tesMatch[1].match(/(\d+[\s-]+\d+\s+(?:iş\s+günü|hafta|gün))/i);
    teslim = subTes ? subTes[1] : tesMatch[1].trim();
  }

  let gun = 8;
  const gunMatch = (terms || txt).match(/(\d+)\s+adam\.gün\s+için\s+verilmiştir/i);
  if (gunMatch) gun = parseInt(gunMatch[1], 10);

  let gunfiyat = 800;
  const gfMatch = (terms || txt).match(/ilave\s+adam\.gün\s+için\s+[€$₺]?\s*(\d+)/i);
  if (gfMatch) gunfiyat = parseInt(gfMatch[1], 10);

  let signer = "Aydın SARIKAYA, Elektrik Mühendisi";
  const sgMatch = txt.match(/Saygılarımızla,?\s*\n+([^\n]+)(?:\n+([^\n]+))?/i);
  if (sgMatch) {
    const s1 = sgMatch[1].trim();
    const s2 = (sgMatch[2] || "").trim();
    if (s2 && !ownRe.test(s2) && !s2.startsWith("Not:")) {
      signer = `${s1}, ${s2}`;
    } else {
      signer = s1;
    }
  }

  let endTblIdx = lines.length;
  for (let i = tableHdrIdx; i < lines.length; i++) {
    if (/kdv hariç/i.test(lines[i])) {
      endTblIdx = i;
      break;
    }
  }

  // --- ÇOK SATIRLI VE BOŞLUKLU RAKAMLARI AYRIŞTIRAN AKILLI KALEM AYRIŞTIRICI ---
  const endPattern = /\b(Adet|Set|Mt|Metre|Kg|Paket|Ad\.?|Saat|G[üu]n|Ay|Adam\.G[üu]n)\b\s+(\d+(?:[.,]\d+)?)\s+[€$₺]?\s*([\d\s.,]+?)\s+[€$₺]?\s*([\d\s.,]+|Opsiyonel)\s*$/i;
  const headerResidue = /^(birim fiyat|euro|tutar|tl|usd|miktar|açıklamalar|marka \/ model|marka\/model|birim|no)$/i;
  const brandPattern = /\b(AYDN|Helvar\s+[A-Za-z0-9\-_./]+|TP\s*8\"|Lenovo|Base|LCNSNR\d+|[A-Z0-9\-_./]+)$/i;

  function parseNumJs(v) {
    if (typeof v === 'number') return v;
    let s = String(v || '').replace(/[^\d,.-]/g, '');
    if (!s) return 0;
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(',', '.');
    return parseFloat(s) || 0;
  }

  function splitDescBrand(txt) {
    txt = txt.trim();
    const m = txt.match(brandPattern);
    if (m && m.index > 0) {
      const brand = m[1].trim();
      const desc = txt.slice(0, m.index).trim();
      return { desc: desc || brand, brand: brand };
    }
    return { desc: txt, brand: '' };
  }

  const items = [];
  let currentGroup = '';
  let i = tableHdrIdx + 1;

  while (i < endTblIdx) {
    const rawLine = lines[i].trim();
    if (!rawLine || headerResidue.test(rawLine)) {
      i++;
      continue;
    }

    const endMatch = rawLine.match(endPattern);
    const numStartMatch = rawLine.match(/^(\d+)(?:\s+(.*))?$/);

    if (endMatch) {
      let beforeMatch = rawLine.slice(0, endMatch.index).trim();
      const rowNumM = beforeMatch.match(/^(\d+)\s+(.*)$/);
      let descBrandPart = rowNumM ? rowNumM[2].trim() : beforeMatch;

      const unit = endMatch[1].trim();
      const qty = parseFloat(endMatch[2].replace(',', '.')) || 0;
      const price = parseNumJs(endMatch[3]);
      const opt = /opsiyonel/i.test(endMatch[4]);

      const sb = splitDescBrand(descBrandPart);
      items.push({
        group: currentGroup,
        desc: sb.desc,
        brand: sb.brand,
        unit: unit,
        qty: qty,
        price: price,
        opt: opt
      });
      i++;
    } else if (numStartMatch && numStartMatch[1].length <= 3 && (!numStartMatch[2] || !numStartMatch[2].match(endPattern))) {
      const descParts = [];
      if (numStartMatch[2]) descParts.push(numStartMatch[2].trim());

      i++;
      while (i < endTblIdx) {
        const subLine = lines[i].trim();
        if (!subLine || headerResidue.test(subLine)) {
          i++;
          continue;
        }

        const subEndMatch = subLine.match(endPattern);
        if (subEndMatch) {
          const beforeSub = subLine.slice(0, subEndMatch.index).trim();
          if (beforeSub) descParts.push(beforeSub);

          const unit = subEndMatch[1].trim();
          const qty = parseFloat(subEndMatch[2].replace(',', '.')) || 0;
          const price = parseNumJs(subEndMatch[3]);
          const opt = /opsiyonel/i.test(subEndMatch[4]);

          const fullDesc = descParts.join(' ').trim();
          const sb = splitDescBrand(fullDesc);

          items.push({
            group: currentGroup,
            desc: sb.desc,
            brand: sb.brand,
            unit: unit,
            qty: qty,
            price: price,
            opt: opt
          });
          i++;
          break;
        } else {
          descParts.push(subLine);
          i++;
        }
      }
    } else {
      if (rawLine.length < 80 && !/\d+[.,]\d+/.test(rawLine)) {
        currentGroup = rawLine;
      }
      i++;
    }
  }

  let pdfTotal = 0;
  const totMatch = txt.match(/KDV\s+Hariç\s+Genel\s+Toplam[^:]*:[€$₺]?\s*([\d\s.,]+)/i);
  if (totMatch) pdfTotal = parseNumJs(totMatch[1]);

  const tpos = (termsHdrIdx >= 0 && tableHdrIdx > termsHdrIdx) || items.length > 6 ? "page2" : "inline";

  return {
    no: no,
    date: date,
    customer: customer,
    contact: contact,
    attn: attn,
    project: project,
    konu: konu,
    intro: intro,
    ttitle: `${project} ${konu} Teklifi`.trim(),
    tpos: tpos,
    cur: cur,
    valid: valid,
    validUntil: validUntil,
    teslim: teslim,
    gun: gun,
    gunfiyat: gunfiyat,
    signer: signer,
    terms: terms,
    items: items,
    _total: pdfTotal
  };
}

document.addEventListener("change", e => {
  if (e.target.id !== "bkfile") return;
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      let loadedQuotes = null;
      let loadedCatalog = null;
      
      if (Array.isArray(data)) {
        loadedQuotes = data;
      } else if (data && typeof data === "object") {
        if (Array.isArray(data.quotes)) loadedQuotes = data.quotes;
        else if (Array.isArray(data.teklifler)) loadedQuotes = data.teklifler;
        else if (Array.isArray(data.items) && data.items.some(x => x.no || x.customer)) loadedQuotes = data.items;
        
        if (Array.isArray(data.catalog)) loadedCatalog = data.catalog;
        else if (Array.isArray(data.kalemler)) loadedCatalog = data.kalemler;
      }
      
      if (!loadedQuotes && !loadedCatalog) {
        toast("JSON içinde geçerli teklif veya kalem verisi bulunamadı!");
        return;
      }
      
      if (loadedQuotes) {
        quotes = loadedQuotes;
        saveLocal();
      }
      if (loadedCatalog) {
        catalog = loadedCatalog;
        saveCat(catalog);
      } else if (quotes.length) {
        saveCat(quotes.flatMap(q => q.items || []));
      }

      // Buluta (Firebase Firestore) toplu senkronize et
      if (db) {
        toast("Bulut veritabanına eşitleniyor…");
        try {
          const batch = db.batch();
          if (loadedQuotes) {
            loadedQuotes.forEach(q => {
              if (!q.id) q.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
              batch.set(db.collection("quotes").doc(q.id), q);
            });
          }
          if (catalog && catalog.length) {
            catalog.forEach(c => {
              if (!c.id) c.id = ckey(c);
              batch.set(db.collection("catalog").doc(c.id), c);
            });
          }
          batch.commit().then(() => {
            toast("Yedek hem bu tarayıcıya hem buluta yüklendi (" + (loadedQuotes ? loadedQuotes.length : 0) + " teklif)!");
          }).catch(err => {
            console.error("Firestore batch commit hatası:", err);
            // Teker teker yüklemeyi dene
            if (loadedQuotes) {
              loadedQuotes.forEach(q => db.collection("quotes").doc(q.id).set(q));
            }
          });
        } catch(err) {
          console.warn("Bulut batch hatası:", err);
        }
      } else {
        toast("Yedek yerel olarak yüklendi (" + (loadedQuotes ? loadedQuotes.length : 0) + " teklif)!");
      }
      
      render();
      fillPl();
      $("#bkm").style.display = "none";
    } catch(err) {
      toast("Geçersiz JSON dosyası: " + err.message);
    }
  };
  reader.readAsText(f);
  e.target.value = "";
});

const USERS_STORE = "teklif_users_list_v4";
const ACTIVE_USER_STORE = "teklif_active_user_v4";
const AUTH_KEY = "teklif_auth_state_v4";

const DEFAULT_USERS = [
  { username: "aydin", pass: "1234", role: "admin", title: "Yönetici" }
];

function getStoredUsers() {
  try {
    const list = JSON.parse(localStorage.getItem(USERS_STORE));
    if (Array.isArray(list) && list.length > 0) return list;
  } catch(e) {}
  return DEFAULT_USERS;
}

function saveStoredUsers(list) {
  try {
    localStorage.setItem(USERS_STORE, JSON.stringify(list));
  } catch(e) {}
}

function getCurrentUser() {
  try {
    const u = JSON.parse(localStorage.getItem(ACTIVE_USER_STORE));
    if (u && u.username) return u;
  } catch(e) {}
  return { username: "aydin", role: "admin", title: "Yönetici" };
}

function setCurrentUser(u) {
  try {
    localStorage.setItem(ACTIVE_USER_STORE, JSON.stringify(u));
  } catch(e) {}
  updateUserUI();
}

function updateUserUI() {
  const cur = getCurrentUser();
  const nameEl = document.getElementById("u-name");
  const roleEl = document.getElementById("u-role");
  const btnUsers = document.getElementById("btn-u-mgmt");
  const btnBkm = document.getElementById("btn-bkm");
  
  if (nameEl) nameEl.textContent = cur.username;
  if (roleEl) {
    if (cur.role === "admin") {
      roleEl.textContent = "Yönetici";
      roleEl.style.background = "var(--okbg, #e4f3ea)";
      roleEl.style.color = "var(--ok, #1b7447)";
    } else {
      roleEl.textContent = "Personel";
      roleEl.style.background = "var(--bluebg, #e6eef8)";
      roleEl.style.color = "var(--blue, #2a5a99)";
    }
  }

  // Yalnızca Admin (aydin) kullanıcı yönetimi ve yedekleme butonlarını görebilir
  if (btnUsers) btnUsers.style.display = (cur.role === "admin") ? "inline-block" : "none";
  if (btnBkm) btnBkm.style.display = (cur.role === "admin") ? "inline-block" : "none";
}

function withTimeout(promise, ms = 2500) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("Zaman aşımı")), ms))
  ]);
}

// Buluttan kullanıcı listesini senkronize et
function syncUsersFromCloud() {
  if (typeof db !== "undefined" && db) {
    db.collection("settings").doc("users").onSnapshot(doc => {
      if (doc && doc.exists) {
        const d = doc.data();
        if (d && Array.isArray(d.list) && d.list.length > 0) {
          saveStoredUsers(d.list);
          const cur = getCurrentUser();
          const match = d.list.find(x => x.username === cur.username);
          if (match) {
            setCurrentUser({ username: match.username, role: match.role, title: match.title });
          }
        }
      } else {
        // Bulutta henüz liste yoksa aydin:1234 admin kullanıcısını oluştur
        db.collection("settings").doc("users").set({
          list: DEFAULT_USERS,
          updatedAt: new Date().toISOString()
        }).catch(() => {});
      }
    }, err => console.warn("Kullanıcı senkronizasyon:", err));
  }
}

async function performLogin() {
  const usrInput = document.getElementById("login-usr");
  const pwdInput = document.getElementById("login-pwd");
  const feedback = document.getElementById("login-feedback");
  const btnSubmit = document.getElementById("btn-login-submit");
  
  const enteredUser = (usrInput ? usrInput.value : "").trim();
  const enteredPass = (pwdInput ? pwdInput.value : "").trim();
  
  if (!enteredUser || !enteredPass) {
    if (feedback) {
      feedback.textContent = "Lütfen kullanıcı adı ve şifrenizi girin!";
      feedback.style.display = "block";
    }
    return;
  }

  if (btnSubmit) {
    btnSubmit.disabled = true;
    btnSubmit.textContent = "Giriş yapılıyor...";
  }

  let users = getStoredUsers();

  // Giriş anında doğrudan Firebase'den en güncel kullanıcı listesini çek (Cross-browser sync)
  if (typeof db !== "undefined" && db) {
    try {
      const snap = await withTimeout(db.collection("settings").doc("users").get(), 2500);
      if (snap && snap.exists && snap.data() && Array.isArray(snap.data().list) && snap.data().list.length > 0) {
        users = snap.data().list;
        saveStoredUsers(users);
      }
    } catch(e) {
      console.warn("Bulut kullanıcı kontrolü:", e);
    }
  }

  if (btnSubmit) {
    btnSubmit.disabled = false;
    btnSubmit.textContent = "Giriş Yap";
  }

  // BİREBİR EŞLEŞME: Harf büyüklüğü ve Türkçe ı/i karakter ayrımı KATI olarak uygulanır!
  const matchedUser = users.find(u => u.username === enteredUser);

  if (!matchedUser) {
    if (feedback) {
      // Eğer kullanıcı Aydın yazdıysa yardımcı ipucu ver
      if (enteredUser.toLowerCase().replace(/ı/g, "i") === "aydin") {
        feedback.textContent = "Kullanıcı adı bulunamadı! (Lütfen küçük harfle 'aydin' yazınız, 'ı' değil 'i' kullanınız)";
      } else {
        feedback.textContent = "Kullanıcı adı bulunamadı!";
      }
      feedback.style.display = "block";
    }
    return;
  }

  // Şifre kontrolü: YALNIZCA en son güncel şifre geçerlidir! Eski şifre veya 1234 bypass KESİNLİKLE YOK!
  if (matchedUser.pass !== enteredPass) {
    if (feedback) {
      feedback.textContent = "Şifre hatalı!";
      feedback.style.display = "block";
    }
    if (pwdInput) {
      pwdInput.value = "";
      pwdInput.focus();
    }
    return;
  }

  // Giriş Başarılı
  if (feedback) feedback.style.display = "none";
  try { localStorage.setItem(AUTH_KEY, "logged_in"); } catch(e) {}
  setCurrentUser({
    username: matchedUser.username,
    role: matchedUser.role || (matchedUser.username === "aydin" ? "admin" : "user"),
    title: matchedUser.title || (matchedUser.role === "admin" ? "Yönetici" : "Personel")
  });
  hideLoginOverlay();
  if (typeof toast === "function") toast("Hoş geldiniz, " + matchedUser.username);
}

function hideLoginOverlay() {
  const overlay = document.getElementById("login-overlay");
  if (overlay) overlay.style.display = "none";
}

function showLoginOverlay(msg) {
  const overlay = document.getElementById("login-overlay");
  if (overlay) overlay.style.display = "flex";
  const feedback = document.getElementById("login-feedback");
  if (feedback && msg) {
    feedback.textContent = msg;
    feedback.style.display = "block";
  }
  const usrInput = document.getElementById("login-usr");
  if (usrInput) setTimeout(() => usrInput.focus(), 150);
}

window.doLogout = function(msg) {
  try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
  showLoginOverlay(msg);
  const pwdInput = document.getElementById("login-pwd");
  if (pwdInput) pwdInput.value = "";
  if (typeof toast === "function" && !msg) toast("Güvenli çıkış yapıldı.");
};

window.deleteUserRow = async function(idx) {
  const list = getStoredUsers();
  const target = list[idx];
  if (!target || target.username === "aydin") {
    toast("Ana yönetici hesabı silinemez!");
    return;
  }
  if (!confirm(target.username + " kullanıcısını silmek istediğinize emin misiniz?")) return;
  list.splice(idx, 1);
  await saveUsersToCloudAndLocal(list);
  toast("Kullanıcı silindi.");
  renderUsersModal();
};

window.changeUserPassPrompt = async function(idx) {
  const list = getStoredUsers();
  const target = list[idx];
  if (!target) return;
  const newP = prompt(target.username + " kullanıcısı için yeni şifreyi giriniz:", target.pass);
  if (!newP || !newP.trim()) return;
  target.pass = newP.trim();
  await saveUsersToCloudAndLocal(list);
  toast(target.username + " şifresi güncellendi.");
  renderUsersModal();
};

async function saveUsersToCloudAndLocal(list) {
  saveStoredUsers(list);
  if (typeof db !== "undefined" && db) {
    try {
      await db.collection("settings").doc("users").set({
        list: list,
        updatedAt: new Date().toISOString()
      });
    } catch(err) {
      console.error("Buluta kullanıcı kaydı hatası:", err);
      toast("Yerel kaydedildi fakat buluta yazılamadı: " + err.message);
    }
  }
}

    if (!curP || !newP) {
      toast("Lütfen tüm alanları doldurun!");
      return;
    }
    const users = getStoredUsers();
    const userObj = users.find(u => u.username === cur.username);
    
    if (!userObj || userObj.pass !== curP) {
      toast("Mevcut şifreniz hatalı!");
      return;
    }
    if (newP !== newP2) {
      toast("Yeni şifreler birbiriyle uyuşmuyor!");
      return;
    }

    userObj.pass = newP;
    await saveUsersToCloudAndLocal(users);
    modal.style.display = "none";
    toast("Şifreniz başarıyla güncellendi ve buluta kaydedildi!");
  };
};

function initAuth() {
  const isAuth = localStorage.getItem(AUTH_KEY) === "logged_in";
  if (isAuth) {
    hideLoginOverlay();
    updateUserUI();
  } else {
    showLoginOverlay();
  }
  
  syncUsersFromCloud();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initAuth);
} else {
  initAuth();
}

</script></body></html>
